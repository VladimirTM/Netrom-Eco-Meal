server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite's build hashes every filename under /assets (index-<hash>.js, index-<hash>.css, ...), so
    # those can be cached forever — a new deploy always gets a new URL. index.html itself references
    # those hashed names and has none of its own, so it must never be served stale: without this,
    # nginx sends no Cache-Control at all, which leaves browsers free to apply heuristic freshness
    # and serve a cached index.html (pointing at assets from a previous deploy that may no longer
    # exist) on a plain navigation, not just a forced reload.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
