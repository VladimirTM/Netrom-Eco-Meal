services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: EcoMealTest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - ecomeal-test-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catches every email the app sends instead of delivering it anywhere real — lets the
  # confirmation/reset/order-lifecycle emails be demoed end-to-end with zero real SMTP setup.
  # Web UI at http://localhost:8025; the app talks to it over the SMTP port on the Docker network.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

  # Free, self-hosted local model runtime — no paid API/account anywhere in the AI feature set.
  # Dockerfile.ollama bakes the model into the image at build time (`docker compose up --build`),
  # so there's no separate manual pull step — the named volume below just gets seeded from the
  # image's /root/.ollama on first run and persists it (including any other model you pull later)
  # across restarts.
  ollama:
    build:
      context: .
      dockerfile: Dockerfile.ollama
    ports:
      - "11434:11434"
    volumes:
      - ecomeal-test-ollama:/root/.ollama

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__EcoMealContext: "Host=db;Port=5432;Database=EcoMealTest;Username=postgres;Password=postgres"
      SeedAdmin__Email: admin@ecomeal.local
      SeedAdmin__Password: Admin123!
      # Requires real email confirmation on self-registration, so the flow is actually visible —
      # the two seeded demo accounts already have EmailConfirmed=true and are unaffected.
      Identity__RequireConfirmedAccount: "true"
      App__BaseUrl: "http://localhost:8081"
      Email__FromAddress: "no-reply@ecomeal.local"
      Email__FromName: "Eco Meal"
      Email__Smtp__Host: mailpit
      Email__Smtp__Port: "1025"
      # Empty by default — checkout shows a "payments aren't configured yet" error until a real
      # Stripe test-mode secret key (sk_test_...) is supplied here. Get one free from
      # https://dashboard.stripe.com/test/apikeys; no live/production key is ever needed for this app.
      Stripe__SecretKey: ""
      Stripe__Currency: "ron"
      # A self-generated VAPID key pair (WebPush.VapidHelper.GenerateVapidKeys()) — unlike Stripe/
      # SMTP this needs no external account at all, so it ships pre-configured here for a working
      # web-push demo out of the box. Regenerate your own pair for anything beyond local testing.
      WebPush__PublicKey: "BKRseuce1Oy0BD5nf9ougmmmY6F9A06j_-nqXnpXe5QaNpbvB3edTJmpxlgOTn6-_bPSdJadSW44eXkRCUzv6dM"
      WebPush__PrivateKey: "DNhXLRshYWgpQ2ZhGf7uAH5ka0UNe_uz5O5ZIO3r7dA"
      WebPush__Subject: "mailto:admin@ecomeal.local"
      # Points at the ollama service below, which already has the model baked in — the "Write
      # it for me" button works out of the box, no separate setup step.
      Ollama__BaseUrl: "http://ollama:11434"
      Ollama__ModelId: "qwen2.5:7b"
    ports:
      - "8081:8080"
    volumes:
      # Manager-uploaded package/business photos (ImageUploadService) — otherwise lost on every
      # `docker compose up --build` since the image itself is rebuilt from a clean publish.
      - ecomeal-test-uploads:/app/wwwroot/uploads
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
      ollama:
        condition: service_started

volumes:
  ecomeal-test-db:
  ecomeal-test-uploads:
  ecomeal-test-ollama:
